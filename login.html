<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="login.css">
    <title>Area de Login</title>
</head>
<body>

    <main>

         <form action="" id="area-formulario">
                <div class="area-titulo">
                    <div class="logo-login">&lt;JJ/&gt;</div>
                    <h1>Portfólio do Jociel</h1>
                </div>

                <div class="area-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Informe seu email">
                </div>

                <div class="area-senha">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Informe sua senha">

                    <div class="lembrar-senha">
                        <input type="checkbox" id="lembrar">
                        <label for="lembrar">Lembrar-me</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>
                <div> 

                <div class="area-botao">
                    <button>Acessar</button>
                    <a href="#"> Ainda não possui uma conta.</a>
                    <a href="index.html"> Acessar sem conta.</a>
                </div>
        </form>
   
    </main>
    
</body>
</html>
