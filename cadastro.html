<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="src/css/login.css">
    <title>Area de Cadastro</title>
</head>
<body>

    <main>

         <form action="" id="area-cadastro">
                <div class="area-titulo">
                    <div class="logo-login">&lt;JJ/&gt;</div>
                    <h1>Portfólio do Jociel</h1>
                </div>

                <div class="area-nome">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Informe seu nome">
                </div>

                 <div class="area-usuario">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Informe seu usuario">
                </div>

                <div class="area-email">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Informe seu email">
                </div>

                <div class="area-senhas">
                    <div class="senha-cadastro">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Informe sua senha">
                    </div>
                    <div class="area-confirma-senha">
                        <label for="confirma-senha">Confirmar Senha</label>
                        <input type="password" id="confirma-senha" placeholder="Confirme sua senha">
                    </div>
                </div> 

                <div class="area-botao">
                    <button>Cadastrar</button>
                    <a href="login.html"> Já possuo uma conta.</a>
                    <a href="index.html"> Acessar sem conta.</a>
                </div>
        </form>
   
    </main>
    
</body>
</html>
